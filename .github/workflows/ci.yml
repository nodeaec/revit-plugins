# Unit tests only (net8.0, no Revit required).
# Plugins build on Windows with Revit 2026 installed via
# their respective scripts/release.ps1 (not run here).
name: ci

on:
  push:
  pull_request:

jobs:
  unit-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: dotnet test (NodeAec.Licensing.Sample)
        run: dotnet test NodeAec.Licensing.Sample/tests/NodeAec.Licensing.Tests/NodeAec.Licensing.Tests.csproj -c Release --collect:"XPlat Code Coverage"
      - name: dotnet test (NodeAec.Connector)
        run: dotnet test NodeAec.Connector/tests/NodeAec.Connector.Tests/NodeAec.Connector.Tests.csproj -c Release --collect:"XPlat Code Coverage"
