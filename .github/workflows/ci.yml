# Unit tests only (net8.0, no Revit required).
# The plugin itself builds on Windows with Revit 2026 installed via
# NodeAec.Licensing.Sample/scripts/release.ps1 (not run here).
name: ci

on:
  push:
  pull_request:

jobs:
  unit-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: dotnet test
        run: dotnet test NodeAec.Licensing.Sample/tests/NodeAec.Licensing.Tests/NodeAec.Licensing.Tests.csproj -c Release --collect:"XPlat Code Coverage"
